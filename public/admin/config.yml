# PANEL DE EDICIÓN (Decap CMS) · Institución Educativa Privada “Nikola Tesla”
# Se abre en /admin (en el pie de página: 5 clics seguidos sobre el logo).
# Cada cambio publicado se guarda en el repositorio y Netlify actualiza la web en 1 o 2 minutos.
# Guía para la clienta: docs/GUIA_PANEL.md · Configuración técnica: docs/CONFIGURAR_PANEL.md

backend:
  name: github
  repo: LuisTRDev/web-tesla
  branch: main
  commit_messages:
    create: 'Panel: crear {{collection}} “{{slug}}”'
    update: 'Panel: actualizar {{collection}} “{{slug}}”'
    delete: 'Panel: borrar {{collection}} “{{slug}}”'
    uploadMedia: 'Panel: subir imagen “{{path}}”'
    deleteMedia: 'Panel: borrar imagen “{{path}}”'

# Solo funciona al abrir el panel en tu computadora (localhost) con `npm run panel`: edita sin iniciar sesión.
local_backend: true

# Copia automática del borrador en el aparato: si se cierra el navegador sin publicar, Decap ofrece recuperar lo escrito.
local_backup: true

locale: es
logo_url: /images/logo-escudo.png
# Para revisar los cambios antes de publicar, quitar el # de la línea siguiente (Borrador → En revisión → Publicado).
# publish_mode: editorial_workflow
show_preview_links: false

media_folder: public/images/subidas
public_folder: /images/subidas

collections:
  # ───────────────────────── DATOS DEL COLEGIO ─────────────────────────
  - name: colegio
    label: Datos del colegio
    label_singular: Datos del colegio
    description: Nombre, frases, ubicación, WhatsApp, redes, fotos principales y cifras. Se usa en toda la web.
    media_folder: /public/images/generales
    public_folder: /images/generales
    files:
      - name: settings
        label: Datos del colegio
        file: content/settings.json
        fields:
          - { label: Nombre oficial, name: name, widget: string }
          - { label: Nombre corto, name: shortName, widget: string, hint: 'Aparece en el logo y en los títulos. Ejemplo: Nikola Tesla.' }
          - { label: Rótulo sobre el nombre, name: kicker, widget: string, hint: 'Ejemplo: Institución Educativa Privada.' }
          - { label: Frase principal, name: tagline, widget: string, hint: 'Se ve en la portada. Ejemplo: Donde la curiosidad se convierte en futuro.' }
          - { label: Concepto, name: concept, widget: string, required: false }
          - { label: Frase del pie de página, name: footerPhrase, widget: string }
          - { label: Descripción para Google, name: description, widget: seo-descripcion, hint: 'Texto que aparece bajo el nombre del colegio en Google. Entre 120 y 160 caracteres.' }
          - { label: Año de admisión, name: admissionYear, widget: number, value_type: int, min: 2025, max: 2100, hint: 'Cambiarlo cambia los textos “Admisión 2027”. La dirección /admision-2027 no cambia sola; avisa al desarrollador.' }
          - label: Último día de inscripciones
            name: admissionDeadline
            widget: datetime
            date_format: 'YYYY-MM-DD'
            time_format: false
            format: 'YYYY-MM-DD'
            required: false
            hint: 'Activa el contador regresivo. Si lo dejas vacío, el contador no se muestra.'
          - { label: Dirección de la web, name: siteUrl, widget: string, hint: 'Ejemplo: https://www.colegionikolatesla.edu.pe. Si olvidas el https://, la web lo agrega sola.' }
          - label: Ubicación
            name: location
            widget: object
            fields:
              - { label: Dirección, name: address, widget: string }
              - { label: Distrito, name: district, widget: string }
              - { label: Provincia, name: province, widget: string }
              - { label: Región, name: region, widget: string }
              - { label: País, name: country, widget: string }
              - { label: Búsqueda para el mapa, name: mapQuery, widget: string, hint: 'Texto que se envía a Google Maps. Ejemplo: Mz. B Lote 13, Nuevo Imperial, Cañete, Lima, Perú.' }
          - label: Contacto
            name: contact
            widget: object
            fields:
              - label: Números de WhatsApp
                name: whatsapp
                widget: list
                hint: 'El primero es el principal (botón flotante y formularios). Solo números con el código del país. Ejemplo: 51960209798.'
                field: { label: Número, name: number, widget: string, pattern: ['^51\d{9}$', 'Escribe solo números: 51 seguido de los 9 dígitos del celular.'] }
              - { label: Horario de atención, name: hours, widget: string, required: false, hint: 'Ejemplo: Lunes a viernes, 7:30 a. m. – 3:00 p. m.' }
              - label: Botón flotante de WhatsApp
                name: whatsappButton
                widget: object
                hint: 'El botón verde que acompaña a las visitas en toda la web. Cambia su texto, su lado y el mensaje que se envía según la página.'
                fields:
                  - { label: Texto del botón, name: label, widget: string, required: false, default: '¿Consultas? Escríbenos', hint: 'Se ve en computadora. Déjalo vacío para mostrar solo el ícono.' }
                  - { label: Lado de la pantalla, name: side, widget: select, default: derecha, options: [{ label: Derecha, value: derecha }, { label: Izquierda, value: izquierda }] }
                  - { label: Mensaje general, name: defaultMessage, widget: string, default: 'Hola, quisiera información sobre la I.E.P. Nikola Tesla.', hint: 'Es lo que escribe la familia al tocar el botón. En el texto puedes usar {año} para poner el año de admisión.' }
                  - label: Mensajes según la página
                    name: messages
                    widget: list
                    required: false
                    summary: '{{fields.path}} → {{fields.message}}'
                    hint: 'Así sabrás desde qué página escribió cada familia. Ejemplo: en Admisión, “Quisiera información sobre la Admisión {año}”.'
                    fields:
                      - label: Página
                        name: path
                        widget: select
                        options: &sitePages
                          - { label: Portada, value: / }
                          - { label: Admisión (todas las páginas de admisión), value: /admision }
                          - { label: Página de campaña (Admisión 2027), value: /admision-2027 }
                          - { label: Nosotros, value: /nosotros }
                          - { label: Propuesta educativa, value: /propuesta }
                          - { label: Niveles, value: /niveles }
                          - { label: Actividades, value: /actividades }
                          - { label: Galería, value: /galeria }
                          - { label: Noticias, value: /noticias }
                          - { label: Calendario, value: /calendario }
                          - { label: Documentos, value: /documentos }
                          - { label: Contacto, value: /contacto }
                      - { label: Mensaje, name: message, widget: string }
          - label: Respaldo oficial
            name: legal
            widget: object
            fields:
              - { label: Resolución de funcionamiento (UGEL), name: resolution, widget: string, required: false }
              - { label: Código modular, name: modularCode, widget: string, required: false }
          - label: Redes sociales
            name: social
            widget: object
            hint: Pega el enlace completo. Si está vacío, el ícono no se muestra.
            fields:
              - { label: Facebook, name: facebook, widget: string, required: false }
              - { label: Instagram, name: instagram, widget: string, required: false }
              - { label: TikTok, name: tiktok, widget: string, required: false }
              - { label: YouTube, name: youtube, widget: string, required: false }
          - label: Formularios al correo
            name: forms
            widget: object
            collapsed: true
            summary: '{{fields.emailKey}}'
            hint: 'Además de abrir WhatsApp, cada formulario (información y visita) llega al correo del colegio. Gratis con Web3Forms.'
            fields:
              - { label: Clave de acceso de Web3Forms, name: emailKey, widget: string, required: false, hint: 'Entra a web3forms.com, escribe el correo del colegio y te llega una clave. Pégala aquí. Déjala vacía para no enviar correos.' }
          - label: Agendar visita en calendario
            name: booking
            widget: object
            collapsed: true
            summary: '{{fields.url}}'
            fields:
              - { label: Enlace de tu calendario, name: url, widget: string, required: false, hint: 'Crea una cuenta gratis en calendly.com o cal.com, configura tus horarios y pega aquí el enlace (https://calendly.com/tu-colegio/visita). Déjalo vacío para no mostrar el calendario.' }
          - label: Animación al escanear el QR
            name: qrIntro
            widget: object
            collapsed: true
            summary: '{{fields.animation}}'
            hint: 'Lo que se ve un instante cuando una familia escanea un QR impreso, antes de entrar a la web. Vale para todos los QR ya impresos.'
            fields:
              - label: Animación
                name: animation
                widget: select
                default: atomo
                options:
                  - { label: '⚛️ Átomo con electrones (el escudo es el núcleo)', value: atomo }
                  - { label: '⚡ Rayos que caen sobre el escudo', value: rayos }
                  - { label: '🔮 Bobina Tesla (arcos eléctricos)', value: bobina }
                  - { label: '〰️ Línea de energía (como en la web)', value: energia }
                  - { label: '✨ Explosión de chispas', value: chispas }
                  - { label: '🌌 Constelaciones (estrellas que se unen)', value: constelaciones }
                  - { label: '🔌 Circuito (pistas de luz que viajan)', value: circuito }
                  - { label: '🎆 Fuegos artificiales', value: fuegos }
                  - { label: '🇵🇪 Bandera del Perú ondeando', value: bandera }
                  - { label: '🚫 Ninguna (entrar directo a la web)', value: ninguna }
              - label: A dónde llevan los QR impresos
                name: destination
                widget: select
                default: campana
                hint: 'Los QR ya impresos no cambian, pero aquí decides a dónde llevan. Pasada la fecha de cierre, siempre llevan a Admisión.'
                options:
                  - { label: '🚀 Página de la campaña de Admisión (recomendado)', value: campana }
                  - { label: '💬 Abrir WhatsApp con un mensaje', value: whatsapp }
                  - { label: '📞 Página de Contacto', value: contacto }
                  - { label: '🏠 Inicio de la web', value: inicio }
              - { label: Frase bajo el nombre, name: text, widget: string, required: false, hint: 'Ejemplo: Admisión 2027. Déjala vacía para no mostrar frase.' }
              - { label: Duración (segundos), name: seconds, widget: number, value_type: float, min: 1.5, max: 6, default: 2.8, hint: 'Entre 1,5 y 6. Quien escanea puede saltarla tocando “Saltar”.' }
          - { label: 'Mostrar etiquetas “Por confirmar”', name: showDraftBadges, widget: boolean, default: true, hint: 'Desmárcalo cuando todos los textos estén confirmados, antes de la campaña.' }
          - label: Fotos y video principales
            name: images
            widget: object
            hint: 'Recomendado: fotos horizontales, de menos de 2 MB, sin logo ni texto encima.'
            fields:
              - { label: Foto de la portada, name: hero, widget: image, required: false }
              - { label: Video de la portada, name: heroVideo, widget: file, required: false, hint: 'Archivo .mp4 de 10 a 15 segundos y menos de 8 MB. Si lo pones, reemplaza a la foto.' }
              - { label: Foto de Nosotros, name: about, widget: image, required: false }
              - { label: Foto de detalle de Nosotros, name: aboutDetail, widget: image, required: false }
              - { label: Foto de Admisión, name: admission, widget: image, required: false }
              - { label: Imagen al compartir en redes, name: share, widget: image, required: false, hint: 'Medida ideal: 1200 × 630 px. Si la dejas vacía, se genera una automática.' }
          - label: Cifras del colegio
            name: stats
            widget: list
            allow_add: false
            summary: '{{fields.label}}: {{fields.value}}'
            hint: 'Solo datos reales. Si una cifra está vacía, se muestra [DATO].'
            fields:
              - { label: Código, name: id, widget: hidden }
              - { label: Texto, name: label, widget: string }
              - { label: Valor, name: value, widget: string, required: false, hint: 'Ejemplo: 15  o  +300' }

  # ───────────────────────── PÁGINAS Y TEXTOS ─────────────────────────
  - name: paginas
    label: Títulos, portada y aviso
    label_singular: Página
    description: Los títulos grandes de cada página, el aviso sobre el menú y los textos de la página de campaña.
    media_folder: /public/images/generales
    public_folder: /images/generales
    files:
      - name: modules
        label: Secciones del sitio (menú y títulos)
        file: content/modules.json
        fields:
          - label: Secciones
            name: items
            widget: list
            allow_add: false
            summary: '{{fields.label}}'
            fields:
              - { label: Código, name: id, widget: hidden }
              - { label: Nombre en el menú, name: label, widget: string }
              - { label: Título grande de la página, name: title, widget: string }
              - { label: Introducción, name: intro, widget: text }
              - { label: Resumen en la portada, name: teaser, widget: string }
              - { label: Rótulo sobre el título, name: kicker, widget: string, required: false }
              - { label: Descripción para Google, name: seoDescription, widget: seo-descripcion, hint: 'Entre 120 y 160 caracteres.' }
              - { label: Título para Google, name: seoTitle, widget: string, required: false, hint: 'Lo que se ve como título azul en Google. Si lo dejas vacío, se usa el nombre del menú.' }
              - { label: Imagen al compartir esta página, name: shareImage, widget: image, required: false, hint: 'Se ve al enviar el enlace por WhatsApp o Facebook. Medida ideal: 1200 × 630 px.' }
      - name: pages
        label: Portada y página de campaña
        file: content/pages.json
        fields:
          - label: Portada
            name: home
            widget: object
            fields:
              - { label: Texto del aviso de admisión, name: admissionNotice, widget: string, hint: 'Aparece junto a “Admisión 2027” en la portada.' }
          - label: Página de campaña (/admision-2027)
            name: campaign
            widget: object
            hint: 'Es la página a la que llevan los anuncios.'
            fields:
              - { label: Rótulo superior, name: badge, widget: string }
              - { label: Descripción para Google, name: seoDescription, widget: seo-descripcion }
              - { label: Título de “Por qué elegirnos”, name: reasonsTitle, widget: string }
              - label: Razones para elegirnos
                name: reasons
                widget: list
                summary: '{{fields.title}}'
                max: 6
                fields:
                  - { label: Título, name: title, widget: string }
                  - { label: Descripción, name: description, widget: text }
                  - label: Dibujo que acompaña el texto
                    name: illustration
                    widget: select
                    default: tecnologia
                    options: &illustrations
                      - { label: '📚 Libro (formación académica)', value: academica }
                      - { label: '💡 Foco (pensamiento crítico)', value: critico }
                      - { label: '💻 Chip (tecnología)', value: tecnologia }
                      - { label: '🧑‍🤝‍🧑 Persona y corazón (desarrollo personal)', value: personal }
                      - { label: '🛡️ Escudo (valores)', value: valores }
                      - { label: '🎨 Paleta (creatividad)', value: creatividad }
                      - { label: '🧪 Matraz (ciencia)', value: ciencia }
                      - { label: '🎵 Notas musicales (arte)', value: arte }
                      - { label: '⚽ Balón (deportes)', value: deportes }
                      - { label: '🚀 Cohete (proyectos)', value: proyectos }
                      - { label: '⭐ Estrella (eventos)', value: eventos }
                      - { label: '🧑‍🏫 Pizarra (aulas)', value: aulas }
                      - { label: '😀 Carita feliz (recreos)', value: recreo }
                      - { label: '🍎 Manzana (docentes)', value: docentes }
              - { label: Título de los pasos, name: stepsTitle, widget: string }
              - { label: Título de “Agenda tu visita”, name: visitTitle, widget: string }
              - { label: Texto de “Agenda tu visita”, name: visitText, widget: text }

      - name: banner
        label: Avisos destacados (barra sobre el menú)
        file: content/banner.json
        fields:
          - label: Avisos
            name: items
            widget: list
            required: false
            summary: '{{fields.text}}'
            hint: 'Puedes preparar varios avisos con sus fechas. Si hay más de uno visible a la vez, se van alternando cada pocos segundos.'
            fields:
              - { label: Mostrar este aviso, name: enabled, widget: boolean, default: true, hint: 'Apágalo para guardarlo sin que se vea.' }
              - { label: Mensaje, name: text, widget: string, hint: 'Corto y claro. Ejemplo: Inscripciones abiertas · Admisión 2027.' }
              - { label: Texto del botón, name: linkText, widget: string, required: false, hint: 'Ejemplo: Infórmate aquí.' }
              - { label: A dónde lleva el botón, name: linkUrl, widget: string, required: false, hint: 'Una página de la web (ejemplo: /admision-2027, /calendario, /p/reglamento) o un enlace completo (https://…).' }
              - { label: Color de la barra, name: color, widget: select, default: amarillo, options: [{ label: Amarillo, value: amarillo }, { label: Rojo, value: rojo }, { label: Azul, value: azul }, { label: Oscuro, value: oscuro }] }
              - label: Dónde se muestra
                name: where
                widget: select
                default: todas
                options:
                  - { label: En todas las páginas, value: todas }
                  - { label: Solo en la portada, value: portada }
                  - { label: Solo en Admisión, value: admision }
                  - { label: Nosotros, Propuesta, Niveles y Actividades, value: nosotros-propuesta }
                  - { label: Noticias, Calendario y Galería, value: noticias-calendario }
              - { label: Mostrar desde el día, name: startDate, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD', required: false, hint: 'Vacío = desde ahora.' }
              - { label: Mostrar hasta el día, name: endDate, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD', required: false, hint: 'Vacío = sin fecha de fin. Pasado ese día, el aviso desaparece solo.' }

  # ───────────────────────── NOSOTROS ─────────────────────────
  - name: nosotros
    label: Quiénes somos y equipo
    label_singular: Nosotros
    description: La historia y los valores del colegio, el equipo, los logros y lo que dicen las familias.
    media_folder: /public/images/equipo
    public_folder: /images/equipo
    files:
      - name: philosophy
        label: Quiénes somos y valores
        file: content/philosophy.json
        fields:
          - label: Texto principal
            name: about
            widget: object
            fields:
              - { label: Título, name: title, widget: string }
              - { label: Frase destacada, name: quote, widget: string }
              - label: Párrafos
                name: paragraphs
                widget: list
                field: { label: Párrafo, name: paragraph, widget: text }
              - { label: Texto confirmado por el colegio, name: confirmed, widget: boolean, default: false }
          - label: Valores y conceptos
            name: items
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { label: Nombre, name: title, widget: string }
              - { label: Descripción, name: description, widget: string }
              - { label: Confirmado por el colegio, name: confirmed, widget: boolean, default: false }
      - name: team
        label: Equipo
        file: content/team.json
        fields:
          - label: Personas
            name: items
            widget: list
            summary: '{{fields.role}} · {{fields.name}}'
            hint: 'Publica las fotos solo con autorización de cada persona.'
            fields:
              - { label: Cargo, name: role, widget: string, hint: 'Ejemplo: Dirección' }
              - { label: Nombre completo, name: name, widget: string, required: false }
              - { label: Especialidad o breve descripción, name: bio, widget: text, required: false }
              - { label: Foto (retrato), name: image, widget: image, required: false }
      - name: achievements
        label: Logros
        file: content/achievements.json
        fields:
          - label: Logros
            name: items
            widget: list
            summary: '{{fields.year}} · {{fields.title}}'
            fields:
              - { label: Año, name: year, widget: string, required: false, pattern: ['^\d{4}$', 'Escribe el año con 4 números. Ejemplo: 2026.'] }
              - { label: Título, name: title, widget: string }
              - { label: Descripción, name: description, widget: text }
              - { label: Es un espacio de ejemplo, name: isPlaceholder, widget: boolean, default: false, hint: 'Desmárcalo cuando el logro sea real.' }
      - name: testimonials
        label: Testimonios
        file: content/testimonials.json
        fields:
          - label: Testimonios
            name: items
            widget: list
            summary: '{{fields.author}}'
            hint: 'Publica solo con autorización de quien los firma.'
            fields:
              - { label: Testimonio, name: quote, widget: text }
              - { label: Nombre y apellido, name: author, widget: string }
              - { label: Quién es, name: role, widget: select, options: [Padre de familia, Madre de familia, Estudiante, Docente], default: Padre de familia }
              - { label: Es un espacio de ejemplo, name: isPlaceholder, widget: boolean, default: false, hint: 'Desmárcalo cuando el testimonio sea real.' }

  # ───────────────────────── PROPUESTA, NIVELES Y ACTIVIDADES ─────────────────────────
  - name: propuesta
    label: Propuesta, niveles y actividades
    label_singular: Propuesta
    description: Pilares educativos, niveles, actividades y la sección “Así se vive Nikola Tesla”.
    media_folder: /public/images/generales
    public_folder: /images/generales
    files:
      - name: pillars
        label: Pilares de la propuesta educativa
        file: content/pillars.json
        fields:
          - label: Pilares
            name: items
            widget: list
            summary: '{{fields.title}}'
            hint: 'El orden de la lista es el orden en la web.'
            fields:
              - { label: Título, name: title, widget: string }
              - { label: Descripción, name: description, widget: text }
              - { label: Foto, name: image, widget: image, required: false, hint: 'Si no hay foto se muestra la ilustración.' }
              - { label: Dibujo (se ve mientras no haya foto), name: illustration, widget: select, required: false, options: *illustrations }
              - { label: Confirmado por el colegio, name: confirmed, widget: boolean, default: false }
      - name: levels
        label: Niveles
        file: content/levels.json
        fields:
          - label: Niveles
            name: items
            widget: list
            allow_add: false
            summary: '{{fields.name}}'
            fields:
              - { label: Código, name: slug, widget: hidden }
              - { label: Nombre, name: name, widget: string }
              - { label: Frase breve, name: summary, widget: string }
              - { label: Descripción, name: description, widget: text }
              - label: Grados
                name: grades
                widget: list
                required: false
                hint: 'Ejemplo: 1.º grado, 2.º grado… Si no hay grados, se muestra “por confirmar”.'
                field: { label: Grado, name: grade, widget: string }
              - { label: Foto del nivel, name: image, widget: image, required: false }
              - { label: Confirmado por el colegio, name: confirmed, widget: boolean, default: false }
      - name: activities
        label: Actividades
        file: content/activities.json
        fields:
          - label: Actividades
            name: items
            widget: list
            summary: '{{fields.title}}'
            hint: 'Las primeras ocupan los espacios más grandes de la composición.'
            fields:
              - { label: Título, name: title, widget: string }
              - { label: Descripción, name: description, widget: string }
              - { label: Foto, name: image, widget: image, required: false }
              - { label: Dibujo (se ve mientras no haya foto), name: illustration, widget: select, required: false, options: *illustrations }
              - { label: Confirmado por el colegio, name: confirmed, widget: boolean, default: false }
      - name: experience
        label: Así se vive Nikola Tesla
        file: content/experience.json
        fields:
          - label: Momentos
            name: shots
            widget: list
            summary: '{{fields.label}}'
            fields:
              - { label: Rótulo, name: label, widget: string, hint: 'Ejemplo: Clases' }
              - { label: Frase, name: caption, widget: string }
              - { label: Foto, name: image, widget: image, required: false }
              - { label: Dibujo (se ve mientras no haya foto), name: illustration, widget: select, required: false, options: *illustrations }
          - label: Palabras que se desplazan
            name: words
            widget: list
            hint: 'Verbos de la experiencia de aprender. Ejemplo: Preguntar, Explorar…'
            field: { label: Palabra, name: word, widget: string }

  # ───────────────────────── ADMISIÓN Y PREGUNTAS ─────────────────────────
  - name: admision
    label: Admisión y preguntas
    label_singular: Admisión
    description: Los pasos para matricular, requisitos, fechas, vacantes y las preguntas de las familias.
    media_folder: /public/images/generales
    public_folder: /images/generales
    files:
      - name: admission
        label: Proceso de admisión
        file: content/admission.json
        fields:
          - { label: Titular grande, name: headline, widget: string }
          - { label: Texto de invitación, name: intro, widget: text }
          - label: Pasos del proceso
            name: steps
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { label: Título, name: title, widget: string }
              - { label: Descripción, name: description, widget: text }
              - { label: Confirmado por el colegio, name: confirmed, widget: boolean, default: false }
          - label: Requisitos, fechas y vacantes
            name: info
            widget: list
            summary: '{{fields.title}}'
            hint: 'Se muestran como bloques en la página de Admisión.'
            fields:
              - { label: Título, name: title, widget: string }
              - { label: Texto, name: text, widget: text }
      - name: faq
        label: Preguntas frecuentes
        file: content/faq.json
        fields:
          - label: Preguntas
            name: items
            widget: list
            summary: '{{fields.question}}'
            fields:
              - { label: Pregunta, name: question, widget: string }
              - { label: Respuesta, name: answer, widget: text }
              - { label: Respuesta confirmada, name: confirmed, widget: boolean, default: false, hint: 'Solo las respuestas confirmadas se envían a Google.' }

  # ───────────────────────── GALERÍA ─────────────────────────
  - name: galeria
    label: Galería de fotos
    label_singular: Galería
    description: Los eventos del colegio con sus fotos y videos, ordenados por fecha.
    media_folder: /public/images/galeria
    public_folder: /images/galeria
    files:
      - name: gallery
        label: Eventos de la galería
        file: content/gallery.json
        fields:
          - label: Eventos
            name: items
            widget: list
            summary: '{{fields.date}} · {{fields.title}}'
            fields:
              - { label: Título del evento, name: title, widget: string }
              - { label: Fecha, name: date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD', hint: 'Importa: ubica el evento en su año y mes. Con fecha futura, el evento aparece solo ese día.' }
              - { label: Categoría, name: category, widget: string, hint: 'Ejemplo: Eventos, Deportes, Ciencia.' }
              - { label: Descripción, name: description, widget: text }
              - { label: Foto de portada, name: coverImage, widget: image, required: false }
              - { label: Es un evento de ejemplo, name: isPlaceholder, widget: boolean, default: false, hint: 'Desmárcalo cuando el evento sea real.' }
              - label: Fotos y videos
                name: media
                widget: list
                required: false
                summary: '{{fields.type}} · {{fields.caption}}'
                fields:
                  - { label: Tipo, name: type, widget: select, options: [{ label: Foto, value: image }, { label: Video, value: video }], default: image }
                  - { label: Archivo, name: url, widget: file, required: false, hint: 'Foto o video. Para YouTube o Vimeo, usa “Insertar desde URL” y pega el enlace.' }
                  - { label: Imagen de vista previa del video, name: thumbnail, widget: image, required: false }
                  - { label: Descripción breve, name: caption, widget: string, required: false }

      - name: recorrido
        label: Recorrido virtual 360°
        file: content/recorrido.json
        fields:
          - { label: Frase de presentación, name: intro, widget: text, required: false, hint: 'Se ve sobre el visor. Ejemplo: Camina por el colegio desde tu casa.' }
          - label: Lugares del recorrido
            name: scenes
            widget: list
            required: false
            summary: '{{fields.title}}'
            hint: 'Cada lugar es una foto panorámica 360°. Mientras no haya ninguno, la página /recorrido no aparece.'
            fields:
              - { label: Nombre del lugar, name: title, widget: string, hint: 'Ejemplo: Patio principal, Biblioteca, Aula de primaria.' }
              - { label: Foto panorámica 360°, name: image, widget: image, hint: 'Foto equirectangular (2:1), la que sale del modo “Panorama 360” del celular o de una cámara 360°. Máximo unos 6 MB.' }
              - { label: Descripción breve, name: description, widget: text, required: false }

  # ───────────────────────── NOTICIAS ─────────────────────────
  - name: noticias
    label: Noticias
    label_singular: Noticia
    description: Comunicados, logros y novedades. Cada noticia es una publicación.
    folder: content/noticias
    extension: json
    format: json
    create: true
    slug: '{{slug}}'
    media_folder: /public/images/noticias
    public_folder: /images/noticias
    summary: '{{date}} · {{title}}'
    sortable_fields: [date, title]
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Fecha, name: date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD', hint: 'Para programar una noticia, pon una fecha futura: aparecerá sola ese día.' }
      - { label: Categoría, name: category, widget: select, options: [Admisión, Actividades, Comunicados, Deportes, Logros, Cultura], default: Comunicados }
      - { label: Resumen (1 o 2 líneas), name: excerpt, widget: text }
      - { label: Texto completo, name: body, widget: text, hint: 'Deja una línea en blanco entre un párrafo y el siguiente.' }
      - { label: Foto, name: image, widget: image, required: false }
      - { label: Es una noticia de ejemplo, name: isPlaceholder, widget: boolean, default: false, hint: 'Desmárcalo cuando la noticia sea real. Las de ejemplo no aparecen en Google.' }

  # ───────────────────────── CALENDARIO ─────────────────────────
  - name: calendario
    label: Calendario de eventos
    label_singular: Evento
    description: Reuniones, actividades y fechas importantes. Aparecen en /calendario y, si quieres, en la portada. Las familias pueden agregarlos a su calendario.
    folder: content/eventos
    extension: json
    format: json
    create: true
    slug: '{{year}}-{{month}}-{{slug}}'
    media_folder: /public/images/eventos
    public_folder: /images/eventos
    summary: '{{date}} · {{title}}'
    sortable_fields: [date, title]
    fields:
      - { label: Nombre del evento, name: title, widget: string, hint: 'Ejemplo: Reunión de padres de familia.' }
      - { label: Fecha, name: date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD', hint: 'Cuando pasa la fecha, el evento sale solo de “Próximos eventos” y queda en “Eventos pasados”.' }
      - { label: Fecha de fin si dura varios días, name: endDate, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD', required: false }
      - { label: Hora, name: time, widget: string, required: false, hint: 'Texto libre. Ejemplo: 6:00 p. m.' }
      - { label: Lugar, name: place, widget: string, required: false, hint: 'Si lo dejas vacío se usa la dirección del colegio.' }
      - { label: Tipo, name: category, widget: select, options: [Reunión, Académico, Cultural, Deportivo, Admisión, Feriado, Otro], default: Reunión, hint: 'Define el color de la fecha.' }
      - { label: Descripción, name: description, widget: text, required: false }
      - { label: Foto, name: image, widget: image, required: false }
      - { label: Enlace para más información, name: link, widget: string, required: false, hint: 'Una página de la web (/admision-2027) o un enlace completo (https://…).' }
      - { label: Texto del enlace, name: linkText, widget: string, required: false, hint: 'Ejemplo: Ver el programa.' }
      - { label: Es un evento de ejemplo, name: isPlaceholder, widget: boolean, default: false, hint: 'Desmárcalo cuando el evento sea real. Los de ejemplo no se envían a Google.' }

  # ───────────────────────── DOCUMENTOS ─────────────────────────
  - name: documentos
    label: Documentos para descargar
    label_singular: Documento
    description: Reglamento, lista de útiles, ficha de inscripción, calendario escolar… Las familias los descargan desde /documentos y desde Admisión.
    media_folder: /public/documentos
    public_folder: /documentos
    files:
      - name: documentos
        label: Documentos para descargar
        file: content/documentos.json
        fields:
          - label: Documentos
            name: items
            widget: list
            required: false
            summary: '{{fields.category}} · {{fields.title}}'
            hint: 'Sube el archivo (PDF es lo mejor, de menos de 5 MB) y ponle un nombre claro. El orden del panel es el orden en la web.'
            fields:
              - { label: Nombre del documento, name: title, widget: string, hint: 'Ejemplo: Lista de útiles 2027.' }
              - { label: Archivo, name: file, widget: file, hint: 'Elige o sube el archivo PDF, Word o Excel.' }
              - label: Categoría
                name: category
                widget: select
                default: General
                options: [Admisión, Reglamento, Útiles, Formatos, Calendario, General]
                hint: 'Agrupa los documentos en /documentos. Los de “Admisión” también se muestran en la página de Admisión.'
              - { label: Descripción corta, name: description, widget: string, required: false }
              - { label: Fecha del documento, name: date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD', required: false }
              - { label: Mostrar también en Admisión, name: featured, widget: boolean, default: false }

  # ───────────────────────── PÁGINAS NUEVAS ─────────────────────────
  - name: extra
    label: Páginas nuevas
    label_singular: Página
    description: Crea páginas propias (reglamento, convivencia, convenios, bolsa de trabajo…). Se publican en /p/nombre y puedes añadirlas al menú.
    folder: content/paginas
    extension: json
    format: json
    create: true
    slug: '{{slug}}'
    media_folder: /public/images/paginas
    public_folder: /images/paginas
    summary: '{{title}}'
    sortable_fields: [title]
    fields:
      - { label: Título, name: title, widget: string, hint: 'El nombre de la página es también su dirección: “Reglamento interno” → /p/reglamento-interno.' }
      - { label: Publicada, name: published, widget: boolean, default: true, hint: 'Desmárcala para guardarla como borrador: nadie la verá hasta que la actives.' }
      - { label: Rótulo sobre el título, name: kicker, widget: string, required: false, hint: 'Ejemplo: Convivencia escolar.' }
      - { label: Introducción, name: intro, widget: text, required: false }
      - label: Texto
        name: body
        widget: text
        required: false
        hint: 'Deja una línea en blanco entre un párrafo y otro. Para un subtítulo empieza la línea con ## (ejemplo: ## Horario). Para una lista empieza cada línea con - (guion y espacio).'
      - { label: Foto, name: image, widget: image, required: false }
      - { label: Texto bajo la foto, name: imageCaption, widget: string, required: false }
      - { label: Texto del botón, name: buttonText, widget: string, required: false, hint: 'Ejemplo: Escríbenos por WhatsApp.' }
      - { label: A dónde lleva el botón, name: buttonUrl, widget: string, required: false, hint: 'Una página de la web (/contacto) o un enlace completo (https://…).' }
      - label: Archivos para descargar
        name: documents
        widget: list
        required: false
        summary: '{{fields.title}}'
        fields:
          - { label: Nombre, name: title, widget: string }
          - { label: Archivo, name: file, widget: file }
      - { label: Descripción para Google, name: seoDescription, widget: seo-descripcion, required: false, hint: 'Entre 120 y 160 caracteres.' }
      - { label: Imagen al compartir en redes, name: shareImage, widget: image, required: false, hint: 'Si la dejas vacía se usa la foto de la página.' }
      - { label: Fecha de actualización, name: updated, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD', required: false, hint: 'Se muestra al final: “Actualizado el …”.' }

  # ───────────────────────── PERSONALIZAR LA WEB ─────────────────────────
  - name: personalizar
    label: Personalizar la web
    label_singular: Personalizar
    description: El orden de la portada, el menú y el pie de página, los colores y los efectos.
    media_folder: /public/images/generales
    public_folder: /images/generales
    files:
      - name: portada
        label: Orden de la portada
        file: content/portada.json
        fields:
          - label: Secciones de la portada
            name: sections
            widget: list
            allow_add: false
            summary: '{{fields.id}} · {{fields.show}}'
            hint: 'Arrastra para cambiar el orden. Desmarca “Mostrar” para ocultar una sección sin borrar su contenido. La presentación del colegio (arriba de todo) siempre se muestra.'
            fields:
              - label: Sección
                name: id
                widget: select
                options:
                  - { label: 'Explora el colegio (índice de secciones)', value: modulos }
                  - { label: Próximos eventos (calendario), value: eventos }
                  - { label: Noticias, value: noticias }
                  - { label: Testimonios, value: testimonios }
                  - { label: Logros, value: logros }
                  - { label: Documentos para descargar, value: documentos }
                  - { label: Preguntas frecuentes, value: preguntas }
                  - { label: Invitación a la admisión, value: admision }
              - { label: Mostrar en la portada, name: show, widget: boolean, default: true }

      - name: navegacion
        label: Menú y pie de página
        file: content/navegacion.json
        fields:
          - label: Secciones que se ocultan del menú
            name: hiddenModules
            widget: select
            multiple: true
            required: false
            hint: 'Marca las que no quieres mostrar (la página sigue existiendo si alguien tiene el enlace). Útil mientras una sección no tiene contenido.'
            options:
              - { label: Nosotros, value: nosotros }
              - { label: Propuesta educativa, value: propuesta }
              - { label: Niveles, value: niveles }
              - { label: Actividades, value: actividades }
              - { label: Galería, value: galeria }
              - { label: Noticias, value: noticias }
              - { label: Admisión, value: admision }
              - { label: Contacto, value: contacto }
          - label: Enlaces extra en el menú
            name: extraLinks
            widget: list
            required: false
            summary: '{{fields.label}}'
            hint: 'Añade páginas nuevas, el calendario, los documentos o un enlace externo. Con muchos enlaces el menú se llena: usa pocos.'
            fields:
              - { label: Texto, name: label, widget: string, hint: 'Ejemplo: Calendario.' }
              - { label: Enlace, name: href, widget: string, hint: 'Ejemplos: /calendario · /documentos · /p/reglamento-interno · https://…' }
          - label: Botón destacado del menú
            name: cta
            widget: object
            fields:
              - { label: Mostrar el botón, name: show, widget: boolean, default: true }
              - { label: Texto, name: label, widget: string, default: Admisiones, hint: 'Ejemplo: Admisión 2027.' }
              - { label: Enlace, name: href, widget: string, default: /admision }
          - label: Pie de página
            name: footer
            widget: object
            fields:
              - { label: Mostrar la columna “Explorar”, name: showExplore, widget: boolean, default: true }
              - { label: Mostrar el nombre grande de fondo, name: showWatermark, widget: boolean, default: true }
              - label: Enlaces de interés
                name: links
                widget: list
                required: false
                summary: '{{fields.label}}'
                hint: 'Ejemplo: Libro de reclamaciones, Política de privacidad, Reglamento.'
                fields:
                  - { label: Texto, name: label, widget: string }
                  - { label: Enlace, name: href, widget: string }
              - { label: Texto legal o aviso, name: legalText, widget: text, required: false, hint: 'Se muestra al final del pie de página.' }

      - name: apariencia
        label: Colores y efectos
        file: content/apariencia.json
        fields:
          - label: Colores
            name: colors
            widget: object
            hint: 'Elige una paleta lista, o cambia colores sueltos. Los colores sueltos tienen prioridad sobre la paleta. Después de publicar, revisa la web: el texto debe leerse bien sobre cada color.'
            fields:
              - label: Paleta
                name: preset
                widget: select
                default: tesla
                options:
                  - { label: 'Tesla (azul noche y amarillo, la oficial)', value: tesla }
                  - { label: 'Océano (azul petróleo)', value: oceano }
                  - { label: 'Bosque (verde profundo)', value: bosque }
                  - { label: 'Vino (granate)', value: vino }
                  - { label: 'Grafito (sobrio)', value: grafito }
              - { label: 'Color de fondo oscuro', name: noche, widget: color, required: false, allowInput: true, enableAlpha: false, hint: 'Cabeceras, menú y pie de página. Elige un color oscuro.' }
              - { label: 'Color de acento', name: filamento, widget: color, required: false, allowInput: true, enableAlpha: false, hint: 'Botones y detalles. Elige un color vivo y claro (el texto encima es oscuro).' }
              - { label: 'Color rojo', name: rojo, widget: color, required: false, allowInput: true, enableAlpha: false }
              - { label: 'Color azul marino', name: marino, widget: color, required: false, allowInput: true, enableAlpha: false }
              - { label: 'Color de líneas y detalles fríos', name: arco, widget: color, required: false, allowInput: true, enableAlpha: false }
          - label: Efectos
            name: effects
            widget: object
            hint: 'Apaga los que no quieras. Quien tiene activada la opción “reducir movimiento” en su aparato ya no los ve.'
            fields:
              - { label: Línea de energía y animación de la portada, name: fieldAnimation, widget: boolean, default: true }
              - { label: Rayos en la portada, name: lightning, widget: boolean, default: true }
              - { label: Chispas al pasar el cursor, name: sparks, widget: boolean, default: true }
              - { label: Fondo y cursor eléctricos (partículas que siguen al mouse o al dedo), name: electric, widget: select, default: suave, options: [{ label: Apagado, value: apagado }, { label: Suave (recomendado), value: suave }, { label: Normal, value: normal }, { label: Intenso, value: intenso }], hint: 'Puntos de luz unidos por líneas que reaccionan al cursor. Si la web se siente lenta en celulares viejos, elige Suave o Apagado.' }
              - { label: Línea de progreso bajo el menú, name: scrollProgress, widget: boolean, default: true }
              - { label: Cortina de color al cambiar de sección, name: pageTransitions, widget: boolean, default: true }
              - { label: Botón flotante de WhatsApp, name: whatsappFloat, widget: boolean, default: true }
